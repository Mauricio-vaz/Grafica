    function obtenerFecha(){
        const fechaInput = document.getElementById('fecha').value;
        return fechaInput;
    }

    let registros = [];

    function agregarUnidades() {//Esta funcion lee lo que hay en el input y los separa en "turnos"
        registros = [];

        const texto = document.getElementById('unidades').value.trim();
        const turnos = texto.split(",");
        const datos = [];
        if (texto === "") {
            alert("Agregar al menos una unidad");
            return;
        }

        for (let turno of turnos) {
            datos.push(turno.trim().split(/\s+/));
        }

        for (let i = 0; i < datos.length; i++) {
            for (let j = 0; j < datos[i].length; j++) {//me estanque en el segundo FOR
                const numeroUnidad = datos[i][j];
                const informacion = unidades[numeroUnidad];

                if (informacion) {
                    registros.push({
                        fecha: obtenerFecha(),
                        turno: i + 1,
                        tipo: informacion.tipo,
                        unidad: numeroUnidad,
                        prefijo: informacion.prefijo,
                        rejas: informacion.rejas,
                    });
                }
                else {
                    alert("La unidad " + numeroUnidad + " del turno " + (i + 1) + " no existe");
                }
            }
        }

        mostrarResultado();
        const resumen = calcularTotales();
        mostrarResumen(resumen);
        guardarReporteDiario(obtenerFecha(), registros, resumen);
    }

    // ----- Persistencia en localStorage -----
    const CLAVE_STORAGE = "reportesDiarios";

    function cargarReportesDiarios() {
        try {
            const raw = localStorage.getItem(CLAVE_STORAGE);
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            console.error("Error leyendo localStorage", e);
            return {};
        }
    }

    function guardarReportesDiarios(reportes) {
        try {
            localStorage.setItem(CLAVE_STORAGE, JSON.stringify(reportes));
        } catch (e) {
            console.error("Error guardando en localStorage", e);
            alert("No se pudo guardar el reporte en este dispositivo.");
        }
    }

    // Guarda (o reemplaza) el reporte del día indicado
    function guardarReporteDiario(fecha, registrosDelDia, totalesDelDia) {
        if (!fecha) {
            alert("Selecciona una fecha antes de guardar el reporte.");
            return;
        }
        const reportes = cargarReportesDiarios();
        reportes[fecha] = {
            registros: registrosDelDia,
            totales: totalesDelDia
        };
        guardarReportesDiarios(reportes);
    }

    //esta funcion hace que se muestre el resultado en una tabla
    // Agrupa los registros por turno para que no se muestren como una sola lista larga
    function mostrarResultado() {
        const grupos = { 1: [], 2: [], 3: [] };
        for (let registro of registros) {
            grupos[registro.turno].push(registro);
        }

        let html = "";
        for (const turno of [1, 2, 3]) {
            const filas = grupos[turno];
            if (filas.length === 0) continue;

            const subtotalRejas = filas.reduce((acc, r) => acc + r.rejas, 0);
            const etiquetaUnidades = filas.length === 1 ? "unidad" : "unidades";

            html += `
            <details class="grupoTurno turno${turno}" open>
                <summary>
                    <span class="turnoTitulo">Turno ${turno}</span>
                    <span class="turnoBadge">${filas.length} ${etiquetaUnidades} &middot; ${subtotalRejas} rejas</span>
                </summary>
                <table class="tablaReporte">
                <thead>
                <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Unidad</th>
                <th>Rejas</th>
                </tr>
                </thead>
                <tbody>
            `;

            for (let registro of filas) {
                html += `
                <tr>
                    <td>${registro.fecha}</td>
                    <td>${registro.tipo}</td>
                    <td>${registro.prefijo}-${registro.unidad.padStart(3, "0")}</td>
                    <td>${registro.rejas}</td>
                </tr>
                `;
            }

            html += `
                </tbody>
                </table>
            </details>
            `;
        }

        document.getElementById('resultado').innerHTML = html || '<p class="vacio">Aún no hay unidades registradas para esta fecha.</p>';
    }

    //esto hace que las rejas se sumen por turno y las arroje en un objeto con la cantidad de vehiculos y rejas por turno
    function calcularTotales() {
        const totales = {
            1: {
                vehiculos: 0,
                rejas: 0
            },
            2: {
                vehiculos: 0,
                rejas: 0
            },
            3: {
                vehiculos: 0,
                rejas: 0
            }
        };
        for (let registro of registros) {
            totales[registro.turno].vehiculos++;
            totales[registro.turno].rejas += registro.rejas;
        }
        return totales;
    }

    //esta funcion hace que el resultado de las rejas se sume y las imprima en un div 
    function mostrarResumen(totales){
        let html = "";
        const totalRejas = totales[1].rejas + totales[2].rejas + totales[3].rejas;
        const totalVehiculo = totales[1].vehiculos + totales[2].vehiculos + totales[3].vehiculos;
        html +=  `
        <h3>Resumen de rejas lavadas por turno</h3>

        <div class= "tarjeta"> 
            <h3>Turno 1</h3>
            <p>Vehiculos: ${totales[1].vehiculos}</p>
            <p>Rejas: ${totales[1].rejas}</p>
            </div>

        <div class= "tarjeta"> 
            <h3>Turno 2</h3>
            <p>Vehiculos: ${totales[2].vehiculos}</p>
            <p>Rejas: ${totales[2].rejas}</p>
            </div>

        <div class= "tarjeta"> 
            <h3>Turno 3</h3>
            <p>Vehiculos: ${totales[3].vehiculos}</p>
            <p>Rejas: ${totales[3].rejas}</p>
            </div>
        <div class="totalGeneral">
            TOTAL DE REJAS LAVADAS EN TOTAL: ${totalRejas}<br>
            TOTAL DE VEHICULOS LAVADOS EN TOTAL: ${totalVehiculo}
        </div> 
        `;
        document.getElementById("resumen").innerHTML = html;

        //esta parte es para que el usuario ingrese las unidades y una vez de guardar, el input se limpie
    }

    // ================= EXPORTAR A EXCEL =================

    function abrirPanelExportar() {
        const hoy = new Date();
        document.getElementById("anioReporte").value = hoy.getFullYear();
        document.getElementById("mesReporte").value = String(hoy.getMonth() + 1);
        document.getElementById("panelExportar").style.display = "block";
        actualizarPanelExportar();
    }

    function cerrarPanelExportar() {
        document.getElementById("panelExportar").style.display = "none";
    }

    // Muestra u oculta el selector de quincena según el tipo de reporte elegido
    function actualizarPanelExportar() {
        const tipo = document.getElementById("tipoReporte").value;
        document.getElementById("opcionQuincena").style.display = (tipo === "quincenal") ? "inline" : "none";
    }

    function pad2(n) {
        return String(n).padStart(2, "0");
    }

    // Calcula fecha de inicio y fin (strings "YYYY-MM-DD") según el periodo elegido
    function calcularRangoFechas(tipo, anio, mes, quincena) {
        const diasEnMes = new Date(anio, mes, 0).getDate();
        if (tipo === "mensual") {
            return {
                inicio: `${anio}-${pad2(mes)}-01`,
                fin: `${anio}-${pad2(mes)}-${pad2(diasEnMes)}`
            };
        }
        // quincenal
        if (quincena === "1") {
            return {
                inicio: `${anio}-${pad2(mes)}-01`,
                fin: `${anio}-${pad2(mes)}-15`
            };
        }
        return {
            inicio: `${anio}-${pad2(mes)}-16`,
            fin: `${anio}-${pad2(mes)}-${pad2(diasEnMes)}`
        };
    }

    // Suma vehículos y rejas de los 3 turnos de un día
    function totalDelDia(totales) {
        let vehiculos = 0, rejas = 0;
        for (const turno of [1, 2, 3]) {
            if (totales[turno]) {
                vehiculos += totales[turno].vehiculos;
                rejas += totales[turno].rejas;
            }
        }
        return { vehiculos, rejas };
    }

    function generarExcelDesdeFormulario() {
        const tipo = document.getElementById("tipoReporte").value;
        const anio = parseInt(document.getElementById("anioReporte").value, 10);
        const mes = parseInt(document.getElementById("mesReporte").value, 10);
        const quincena = document.getElementById("quincenaReporte").value;

        if (!anio || !mes) {
            alert("Indica el mes y el año del reporte.");
            return;
        }

        const rango = calcularRangoFechas(tipo, anio, mes, quincena);
        const todosLosReportes = cargarReportesDiarios();
        const todasLasFechas = Object.keys(todosLosReportes).sort();

        if (todasLasFechas.length === 0) {
            alert("No hay ningún reporte guardado todavía.");
            return;
        }

        // Fechas dentro del periodo elegido: solo se usan para el resumen y la gráfica
        const fechasEnRango = todasLasFechas.filter(f => f >= rango.inicio && f <= rango.fin);

        const resumenPorDia = fechasEnRango.map(fecha => {
            const totalDia = totalDelDia(todosLosReportes[fecha].totales);
            return { fecha, ...totalDia };
        });

        // Detalle completo: TODOS los datos que el usuario ha ingresado hasta ahora,
        // sin importar si caen dentro del periodo elegido para la gráfica.
        const detalleCompleto = [];
        for (const fecha of todasLasFechas) {
            for (const registro of todosLosReportes[fecha].registros) {
                detalleCompleto.push(registro);
            }
        }

        const nombrePeriodo = (tipo === "mensual")
            ? `Mensual_${pad2(mes)}-${anio}`
            : `Quincena${quincena}_${pad2(mes)}-${anio}`;

        if (resumenPorDia.length === 0) {
            alert("No hay datos en el periodo elegido para la gráfica; aun así se exportará todo el historial capturado.");
            construirExcel(resumenPorDia, detalleCompleto, null, nombrePeriodo);
            return;
        }

        generarImagenGrafica(resumenPorDia, (imagenBase64) => {
            construirExcel(resumenPorDia, detalleCompleto, imagenBase64, nombrePeriodo);
        });
    }

    // Dibuja la gráfica de barras (rejas por día) en un canvas oculto y regresa la imagen en base64
    function generarImagenGrafica(resumenPorDia, callback) {
        const canvas = document.createElement("canvas");
        canvas.width = 800;
        canvas.height = 400;

        new Chart(canvas.getContext("2d"), {
            type: "bar",
            data: {
                labels: resumenPorDia.map(r => r.fecha.slice(5).split("-").reverse().join("/")),
                datasets: [
                    {
                        label: "Rejas lavadas",
                        data: resumenPorDia.map(r => r.rejas),
                        backgroundColor: "#4a90d9",
                        yAxisID: "yRejas"
                    },
                    {
                        label: "Vehículos",
                        data: resumenPorDia.map(r => r.vehiculos),
                        backgroundColor: "#d97706",
                        yAxisID: "yVehiculos"
                    }
                ]
            },
            options: {
                animation: false,
                responsive: false,
                plugins: {
                    title: { display: true, text: "Rejas y vehículos por día" },
                    legend: { display: true }
                },
                scales: {
                    yRejas: {
                        type: "linear",
                        position: "left",
                        beginAtZero: true,
                        title: { display: true, text: "Rejas" }
                    },
                    yVehiculos: {
                        type: "linear",
                        position: "right",
                        beginAtZero: true,
                        title: { display: true, text: "Vehículos" },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });

        // Sin animación, el canvas ya está listo en el siguiente frame
        requestAnimationFrame(() => {
            callback(canvas.toDataURL("image/png"));
        });
    }

    function construirExcel(resumenPorDia, detalleCompleto, imagenBase64, nombrePeriodo) {
        const workbook = new ExcelJS.Workbook();

        // Hoja de resumen
        const hojaResumen = workbook.addWorksheet("Resumen");
        hojaResumen.columns = [
            { header: "Fecha", key: "fecha", width: 14 },
            { header: "Vehículos", key: "vehiculos", width: 12 },
            { header: "Rejas", key: "rejas", width: 12 }
        ];
        resumenPorDia.forEach(r => hojaResumen.addRow(r));

        let totalVehiculos = 0, totalRejas = 0;
        resumenPorDia.forEach(r => { totalVehiculos += r.vehiculos; totalRejas += r.rejas; });
        const filaTotal = hojaResumen.addRow({ fecha: "TOTAL", vehiculos: totalVehiculos, rejas: totalRejas });
        filaTotal.font = { bold: true };

        const imagenId = workbook.addImage({
            base64: imagenBase64,
            extension: "png"
        });
        hojaResumen.addImage(imagenId, {
            tl: { col: 4, row: 1 },
            ext: { width: 520, height: 260 }
        });

        // Hoja de detalle
        const hojaDetalle = workbook.addWorksheet("Detalle");
        hojaDetalle.columns = [
            { header: "Fecha", key: "fecha", width: 14 },
            { header: "Turno", key: "turno", width: 8 },
            { header: "Tipo", key: "tipo", width: 16 },
            { header: "Unidad", key: "unidadTexto", width: 12 },
            { header: "Rejas", key: "rejas", width: 10 }
        ];
        detalleCompleto.forEach(registro => {
            hojaDetalle.addRow({
                fecha: registro.fecha,
                turno: registro.turno,
                tipo: registro.tipo,
                unidadTexto: `${registro.prefijo}-${registro.unidad.padStart(3, "0")}`,
                rejas: registro.rejas
            });
        });

        workbook.xlsx.writeBuffer().then(buffer => {
            const blob = new Blob([buffer], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");
            enlace.href = url;
            enlace.download = `Reporte_${nombrePeriodo}.xlsx`;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
            URL.revokeObjectURL(url);
            cerrarPanelExportar();
        });
    }
