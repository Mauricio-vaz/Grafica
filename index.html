    function obtenerFecha(){
        const hoy = new Date();
        const dia = String(hoy.getDate()).padStart(2, '0');
        const mes = String(hoy.getMonth()+ 1).padStart(2, '0');
        const año = hoy.getFullYear().toString().slice(-4);
        const diaAnterior = String(hoy.getDate()-1).padStart(2, '0');
        return `${diaAnterior}/${mes}/${año}`;
    }

    let registros = [];

    function agregarUnidades() {//Esta funcion lee lo que hay en el input y los separa en "turnos"
        registros = [];

        const texto = document.getElementById('unidades').value.trim();
        const turnos = texto.split(",");
        const datos = [];
        if (texto === "") {
            alert("Agregar al menos una unidad");
            return;
        }

        for (let turno of turnos) {
            datos.push(turno.trim().split(/\s+/));
        }

        for (let i = 0; i < datos.length; i++) {
            for (let j = 0; j < datos[i].length; j++) {//me estanque en el segundo FOR
                const numeroUnidad = datos[i][j];
                const informacion = unidades[numeroUnidad];

                if (informacion) {
                    registros.push({
                        turno: i + 1,
                        unidad: numeroUnidad,
                        prefijo: informacion.prefijo,
                        tipo: informacion.tipo,
                        rejas: informacion.rejas,
                        fecha: obtenerFecha()
                    });
                }
                else {
                    alert("La unidad " + numeroUnidad + " del turno " + (i + 1) + " no existe");
                }
            }
        }

        mostrarResultado();
        const resumen = calcularTotales();
        mostrarResumen(resumen);
    }

    //esta funcion hace que se muestre el resultado en una tabla
    function mostrarResultado() {
        let html = `
        <table class="tablaReporte">

        <th>Turno</th>
        <th>Unidad</th>
        <th>Tipo</th>
        <th>Rejas</th>
        <th>Fecha</th>
        </tr>
        </thead>
        <tbody>
            `;

                <td>${registro.tipo}</td>
                <td>${registro.rejas}</td>
                <td>${registro.fecha}</td>
            </tr>
            `;
        }
        html += `

        </table>`;
        document.getElementById('resultado').innerHTML = html;
        const resumen = calcularTotales();
    }

    //esto hace que las rejas se sumen por turno y las arroje en un objeto con la cantidad de vehiculos y rejas por turno
    function calcularTotales() {
        const totales = {
            1: {
                vehiculos: 0,
                rejas: 0
            },
            2: {
                vehiculos: 0,
                rejas: 0
            },
            3: {
                vehiculos: 0,
                rejas: 0
            }
        };
        for (let registro of registros) {
            totales[registro.turno].vehiculos++;
            totales[registro.turno].rejas += registro.rejas;
        }
        return totales;
    }

    //esta funcion hace que el resultado de las rejas se sume y las imprima en un div 
    function mostrarResumen(totales){

        const totalVehiculo = totales[1].vehiculos + totales[2].vehiculos + totales[3].vehiculos;
        html +=  `
